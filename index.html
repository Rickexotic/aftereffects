<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Club Beneficios Aeropuerto Santiago</title>

styles.css

<script src="https://cdnjs.cloudflare.comap/3.12.5/gsap.min.jsscript>
<script src="https://cdnjs.cloudflare.com/p/3.12.5/ScrollTrigger.min.jsscript>

</head>

<body>

<canvas id="radar"></canvas>

<section class="hero">

    <video autoplay muted loop playsinline>
        assets/hero.mp4
    </video>

    <div class="overlay"></div>

    <div class="hero-content">

        <div class="eyebrow">
            AEROPUERTO DE SANTIAGO
        </div>

        <h1 class="hero-title">
            El viaje no termina
            cuando despega el avión
        </h1>

        <p>
            Construyendo el primer ecosistema de
            fidelización aeroportuaria de Chile
        </p>

    </div>

</section>

<section class="stats">

    <div class="stat">

        <div class="counter" data-value="18000000">
            0
        </div>

        <span>Pasajeros Nacionales</span>

    </div>

    <div class="stat">

        <div class="counter" data-value="8500000">
            0
        </div>

        <span>Pasajeros Internacionales</span>

    </div>

</section>

<section class="story">

    <h2>
        Cada pasajero abandona el aeropuerto
    </h2>

    <p>
        Y la relación termina.
    </p>

</section>

<section class="world">

    <h2>Santiago conectado al mundo</h2>

    <svg viewBox="0 0 1200 600">

        <path class="route"
              d="M520 340 Q350 200 220 180"/>

        <path class="route"
              d="M520 340 Q650 180 820 140"/>

        <path class="route"
              d="M520 340 Q850 270 1030 240"/>

        <path class="route"
              d="M520 340 Q700 420 940 480"/>

        <circle
            cx="520"
            cy="340"
            r="8"
            fill="#E0B96B"/>

    </svg>

</section>

<section class="benchmark">

    <h2>Benchmark Mundial</h2>

    <div class="cards">

        <div class="card">
            <h3>Extime Rewards</h3>
            <p>Airport Retail Ecosystem</p>
        </div>

        <div class="card">
            <h3>Heathrow Rewards</h3>
            <p>Earn & Burn Program</p>
        </div>

        <div class="card">
            <h3>Changi Rewards</h3>
            <p>Omnichannel Loyalty Platform</p>
        </div>

    </div>

</section>

<section class="phone-section">

    <h2>Club Beneficios</h2>

    <div id="phone">

        assets/phone.png

    </div>

</section>

<section class="closing">

    <h1>
        El aeropuerto ya no es un destino
    </h1>

    <h1 class="gold">
        Es una plataforma
    </h1>

</section>

<script src="app.js"></script>

</body>
</html>
