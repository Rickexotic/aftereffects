<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aeropuerto de Santiago</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

</head>

<body>

<div id="presentation">

    <!-- ESCENA 1 -->

    <section class="scene active" id="scene1">

        <div class="content">

            <h1 data-reveal="left">AEROPUERTO DE <span class="highlight glow">SANTIAGO</span></h1>

            <p data-reveal="blur">
                El viaje no termina cuando <span class="highlight">despega</span> el avión
            </p>

        </div>

    </section>

    <!-- ESCENA 2 -->

    <section class="scene" id="scene2">

        <div class="content">

            <div class="counter-wrapper" data-reveal="fade">

                <div class="counter-block">

                    <div id="counterNacional" class="counter">0</div>

                    <span>Pasajeros Nacionales</span>

                </div>

                <div class="counter-block">

                    <div id="counterInternacional" class="counter">0</div>

                    <span>Pasajeros Internacionales</span>

                </div>

            </div>

        </div>

    </section>

    <!-- ESCENA 3 -->

    <section class="scene image-scene" id="scene3">

        <img class="world-map" src="assets/vuelos2.png" alt="Vuelos">

        <div class="overlay-text" data-reveal="fade">

            <span class="highlight glow">Santiago</span> conectado al mundo

        </div>

    </section>

    <!-- ESCENA 4 -->

    <section class="scene" id="scene4">

        <div class="content">

            <h1 data-reveal="words">
                Construyendo el primer ecosistema de <span class="highlight glow">fidelización aeroportuaria</span> de Chile
            </h1>

        </div>

    </section>

    <!-- ESCENA 5 -->

    <section class="scene" id="scene5">

        <div class="content">

            <h1 data-reveal="right">
                El aeropuerto ya no es un <span class="highlight">destino</span>
            </h1>

            <h2 data-reveal="blur">
                Es una <span class="highlight glow">plataforma</span>
            </h2>

        </div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
