<!DOCTYPE html>
<html lang="es">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aeropuerto de Santiago</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

</head>

<body>

<div id="presentation">

    <!-- ESCENA 1 -->

    <section class="scene active" id="scene1">

        <video
            class="hero-video"
            src="assets/hero.mp4"
            autoplay
            muted
            loop
            playsinline>
        </video>

        <div class="content">

            <h1>AEROPUERTO DE SANTIAGO</h1>

            <p>
                El viaje no termina cuando despega el avión
            </p>

        </div>

    </section>

    <!-- ESCENA 2 -->

    <section class="scene" id="scene2">

        <div class="content">

            <div class="counter-wrapper">

                <div class="counter-block">

                    <div id="counterNacional" class="counter">0</div>

                    <span>Pasajeros Nacionales</span>

                </div>

                <div class="counter-block">

                    <div id="counterInternacional" class="counter">0</div>

                    <span>Pasajeros Internacionales</span>

                </div>

            </div>

        </div>

    </section>

    <!-- ESCENA 3 -->

    <section class="scene image-scene" id="scene3">

        <img class="world-map" src="assets/vuelos2.png" alt="Vuelos">

        <div class="overlay-text">

            Santiago conectado al mundo

        </div>

    </section>

    <!-- ESCENA 4 -->

    <section class="scene" id="scene4">

        <div class="content">

            <h1>
                Construyendo el primer ecosistema de fidelización aeroportuaria de Chile
            </h1>

        </div>

    </section>

    <!-- ESCENA 5 -->

    <section class="scene" id="scene5">

        <div class="content">

            <h1>
                El aeropuerto ya no es un destino
            </h1>

            <h2>
                Es una plataforma
            </h2>

        </div>

    </section>

</div>

<script src="app.js"></script>

</body>
</html>
